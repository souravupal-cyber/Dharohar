<html lang="en">

<title>Dharohar — Handcrafted Clay & Terracotta</title>
<meta name="description" content="Dharohar: handcrafted clay diyas, terracotta and bamboo decor, and serveware.">
<meta name="theme-color" content="#C85A32">

<style>
:root{--beige:#F5EFE8;--sand:#EADFD2;--paper:#FCFAF7;--terra:#C85A32;--terra-d:#A5441F;--char:#2B2826;--mute:rgba(43,40,38,.62);--line:rgba(43,40,38,.13);--shadow:0 10px 30px rgba(43,40,38,.14)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--beige);color:var(--char);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
a{color:var(--terra-d)}
.serif{font-family:Georgia,"Times New Roman",serif}
.muted{color:var(--mute);font-size:.88rem}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.end{justify-content:flex-end}
#splash{position:fixed;inset:0;z-index:9999;background:var(--beige);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;animation:splashOut .25s ease .45s forwards}
#splash .sl{font-family:Georgia,serif;letter-spacing:.34em;font-weight:700;font-size:1.5rem;color:var(--char);padding-left:.34em}
@keyframes splashOut{to{opacity:0;visibility:hidden}}
.hdr{position:sticky;top:0;z-index:50;background:rgba(245,239,232,.94);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;justify-content:space-between;height:60px}
.logo{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:.3em;font-size:1.15rem;cursor:default;user-select:none;-webkit-user-select:none;touch-action:manipulation;padding:8px 0}
.hdr-act{display:flex;gap:6px}
.ibtn{position:relative;display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:999px;font-size:.88rem}
.ibtn:hover{background:var(--sand)}
.ibtn svg{width:22px;height:22px;stroke:var(--char);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:0;right:0;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--terra);color:var(--paper);font-size:.7rem;font-weight:700;display:none;align-items:center;justify-content:center}
.badge.on{display:flex}
#banner{display:none;background:var(--char);color:var(--paper);text-align:center;font-size:.85rem;padding:8px 14px}
#banner.on{display:block}
.hero{padding:30px 16px 8px;text-align:center}
.eyebrow{text-transform:uppercase;letter-spacing:.2em;font-size:.72rem;color:var(--terra-d);font-weight:600}
.hero h1{font-family:Georgia,serif;font-size:clamp(1.7rem,5.5vw,2.7rem);line-height:1.2;margin:8px 0 10px;font-weight:600}
.hero p{max-width:520px;margin:0 auto;color:var(--mute)}
.search{position:relative;max-width:520px;margin:18px auto 0}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--mute);fill:none;stroke-width:2}
.search input{width:100%;padding:13px 16px 13px 42px;border:1px solid var(--line);border-radius:999px;background:var(--paper);outline:none}
.search input:focus,.inp:focus{border-color:var(--terra);box-shadow:0 0 0 3px rgba(200,90,50,.15)}
.cats{display:flex;gap:8px;overflow-x:auto;padding:18px 16px 6px;scrollbar-width:none;justify-content:flex-start}
.cats::-webkit-scrollbar{display:none}
@media(min-width:700px){.cats{justify-content:center}}
.cat{flex:none;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--paper);font-size:.9rem;white-space:nowrap}
.cat.on{background:var(--char);border-color:var(--char);color:var(--paper)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:16px 0 50px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
@media(min-width:980px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.cimg{aspect-ratio:1/1;background:var(--sand);overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover}
.card.oos .cimg{opacity:.55}
.cb{padding:12px 14px 14px}
.ccat{font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--terra-d)}
.cb h3{font-family:Georgia,serif;font-size:1rem;font-weight:600;margin:3px 0 8px;line-height:1.3}
.crow{display:flex;justify-content:space-between;align-items:center}
.crow b{font-size:1.02rem}
.add{width:34px;height:34px;border-radius:50%;background:var(--terra);color:var(--paper);font-size:1.3rem;line-height:1}
.add:disabled{background:var(--sand);color:var(--mute);cursor:not-allowed}
.empty{grid-column:1/-1;text-align:center;padding:50px 16px;color:var(--mute)}
.sk{background:linear-gradient(90deg,var(--sand),var(--paper),var(--sand));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:16px;aspect-ratio:3/4}
@keyframes sk{to{background-position:-200% 0}}
footer{text-align:center;padding:26px 16px 40px;color:var(--mute);font-size:.82rem;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--terra);color:var(--paper);padding:12px 22px;border-radius:999px;font-weight:600;font-size:.95rem;transition:background .15s}
.btn:hover{background:var(--terra-d)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--char);border:1px solid var(--char)}
.btn.ghost:hover{background:var(--sand)}
.btn.dark{background:var(--char)}
.btn.dark:hover{background:#000}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:.82rem}
.lnk{color:var(--terra-d);font-size:.82rem;text-decoration:underline}
.inp{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--paper);outline:none}
.inp.sm{padding:8px 10px;font-size:.85rem;width:auto;max-width:100%}
textarea.inp{resize:vertical}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:.8rem;font-weight:600;margin-bottom:5px}
.err{color:var(--terra-d);font-size:.87rem;font-weight:600;margin:6px 0 10px;min-height:1px}
.sec{font-family:Georgia,serif;font-size:1.02rem;margin:18px 0 10px}
.chip{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--sand);color:var(--char);white-space:nowrap}
.chip.ok,.chip.dark{background:var(--char);color:var(--paper)}
.chip.warn{background:var(--terra-d);color:var(--paper)}
.chip.line{background:transparent;border:1px solid var(--line)}
.mback{position:fixed;inset:0;z-index:200;background:rgba(43,40,38,.5);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .2s}
.mback.in{opacity:1}
.msheet{background:var(--beige);width:100%;max-width:520px;max-height:92vh;border-radius:20px;display:flex;flex-direction:column;overflow:hidden;transform:translateY(16px);transition:transform .22s;box-shadow:var(--shadow)}
.mback.in .msheet{transform:none}
.mback.drawer{justify-content:flex-end;align-items:stretch;padding:0}
.drawer .msheet{max-width:440px;max-height:none;height:100%;border-radius:0;transform:translateX(40px)}
.mback.full{padding:0}
.full .msheet{max-width:1100px;max-height:none;height:100%;border-radius:0}
@media(max-width:640px){.mback{align-items:flex-end;padding:0}.msheet{border-radius:20px 20px 0 0;max-height:94vh}.mback.drawer,.mback.full{align-items:stretch}}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);flex:none}
.mh h3{font-size:1.15rem;font-weight:600}
.x{width:34px;height:34px;border-radius:50%;background:var(--sand);font-size:.95rem}
.mb{flex:1;overflow-y:auto;padding:16px 18px;-webkit-overflow-scrolling:touch}
.mf{flex:none;padding:14px 18px;border-top:1px solid var(--line);background:var(--paper);display:grid;gap:10px}
.pm-img{aspect-ratio:1/1;max-height:340px;width:100%;object-fit:cover;background:var(--sand)}
.pm-price{font-size:1.4rem;font-weight:700;margin:6px 0}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--paper)}
.qty button{width:38px;height:38px;font-size:1.2rem}
.qty span{min-width:32px;text-align:center;font-weight:600}
.qty.sm button{width:30px;height:30px}
.pm-act{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.bl{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.bl img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:none;background:var(--sand)}
.bl-i{flex:1;display:grid;gap:3px;align-content:start}
.bl-r{display:flex;flex-direction:column;align-items:flex-end;justify-content:space-between}
.sum-l{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;padding:4px 0}
.sum-t{display:flex;justify-content:space-between;font-weight:700;font-size:1.05rem;border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
.pay-opts{display:grid;grid-template-columns:1fr;gap:8px;margin-bottom:12px}
.po{border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:10px 12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.po input{margin-top:4px;accent-color:var(--terra)}
.po small{display:block;color:var(--mute);font-size:.74rem}
.po:has(input:checked){border-color:var(--terra);box-shadow:0 0 0 2px rgba(200,90,50,.18)}
.upi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;margin-bottom:10px}
.upi.off{display:none}
.qr{width:200px;height:200px;margin:8px auto;border-radius:10px;background:#fff;padding:6px;object-fit:contain}
.upi-id{font-weight:700;letter-spacing:.02em;word-break:break-all}
.upi .row{justify-content:center;margin:8px 0}
.upi .note{font-size:.8rem;color:var(--mute);margin:6px 0 10px}
.bank-box{text-align:left;background:var(--beige);border-radius:10px;padding:10px 12px;font-size:.85rem;margin:8px 0}
.bank-box div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
.bank-box div:last-child{border-bottom:none}
.prog{position:relative;padding:8px 0}
.bar{position:absolute;top:50%;left:14px;right:14px;height:4px;background:var(--sand);border-radius:4px;transform:translateY(-50%)}
.bar i{display:block;height:100%;background:var(--terra);border-radius:4px;transition:width .5s}
.dots{position:relative;display:flex;justify-content:space-between}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.76rem;font-weight:700;background:var(--paper);border:2px solid var(--sand);color:var(--mute);flex:none;position:relative;z-index:1}
.dot.done{background:var(--terra);border-color:var(--terra);color:var(--paper)}
.dot.cur{border-color:var(--terra);color:var(--terra-d);box-shadow:0 0 0 4px rgba(200,90,50,.18)}
.dot.issue{background:var(--char);border-color:var(--char);color:var(--paper)}
.tl{list-style:none;margin-top:12px}
.tl li{display:flex;gap:12px;padding-bottom:14px;position:relative}
.tl li:not(:last-child)::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--sand)}
.tl li.done:not(:last-child)::before{background:var(--terra)}
.tl li.todo{opacity:.5}
.tl b{display:block;font-size:.92rem}
.tl small{color:var(--mute);font-size:.8rem}
.lookup{display:flex;gap:8px;margin-bottom:14px}
.oc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.oc-h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;margin-bottom:8px}
.oc ul.items{list-style:none;font-size:.88rem;margin:8px 0}
.oc ul.items li{display:flex;justify-content:space-between;gap:10px}
.oc-cur{font-weight:600;margin:6px 0 2px;font-size:.92rem}
.oc-cust{font-size:.88rem;margin:6px 0;word-break:break-word}
.oc-act{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.utr{font-family:monospace;background:var(--sand);padding:2px 8px;border-radius:6px;font-size:.85rem}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding:10px 18px;border-bottom:1px solid var(--line);flex:none}
.dtabs button{padding:8px 16px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:.88rem;white-space:nowrap}
.dtabs button.on{background:var(--char);color:var(--paper);border-color:var(--char)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:1.3rem;font-family:Georgia,serif}
.stat span{font-size:.7rem;color:var(--mute)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.filters .cat{padding:6px 12px;font-size:.8rem}
.pr{display:flex;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.pr img{width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;background:var(--sand)}
.pr .pi{flex:1;min-width:0}
.pr .pi b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pe-img{width:120px;height:120px;border-radius:12px;object-fit:cover;background:var(--sand)}
.chk{display:flex;gap:8px;align-items:center;margin-bottom:12px;font-size:.92rem}
.chk input{accent-color:var(--terra);width:18px;height:18px}
.grid2{display:grid;gap:14px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);background:var(--char);color:var(--paper);padding:11px 20px;border-radius:999px;font-size:.9rem;z-index:500;opacity:0;pointer-events:none;transition:all .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.ok-ic{width:56px;height:56px;border-radius:50%;background:var(--terra);color:var(--paper);display:grid;place-items:center;font-size:1.7rem;margin:0 auto 10px}
</style>

  var r = await dialog({ title: 'Put payment on hold', msg: 'Reason for customer:', input: true, placeholder: 'e.g. UTR mismatch', ok: 'Put on Hold' });
  if (r !== null) return runOrderUpdate(el.dataset.id, function (o) { o.payStatus = 'hold'; o.note = r; o.step = 1; addLog(o, 'Payment on hold'); });
};
A.accept = function (el) { return runOrderUpdate(el.dataset.id, function (o) { o.step = 2; addLog(o, 'COD Order accepted'); }); };
A.next = function (el) { return runOrderUpdate(el.dataset.id, function (o) { var n = Math.min(6, stepOf(o) + 1); if (o.method === 'cod' && n === 6) o.payStatus = 'cod_paid'; o.step = n; addLog(o, STEP_T[n]); }); };
A['ext-date'] = async function (el) {
  var o = (S.orders || []).filter(function (x) { return x.id === el.dataset.id; }); if (!o) return;
  var nd = await dialog({ title: 'Change / Extend Delivery Date', msg: 'Select new expected delivery date:', input: true, inputType: 'date', val: o.expectedDate || addDaysStr(6), ok: 'Update Date' });
  if (!nd) return;
  var note = await dialog({ title: 'Optional Reason', msg: 'e.g. Extended by +3 days due to festival rush', input: true, placeholder: 'Optional note for customer', ok: 'Save' });
  return runOrderUpdate(el.dataset.id, function (cur) { cur.expectedDate = nd; cur.delNote = note || 'Updated by team'; addLog(cur, 'Delivery date updated to ' + nd); });
};A['admin-del-ord'] = async function (el) {
  var id = el.dataset.id;
  if (!(await dialog({ title: 'Delete Order ' + id + '?', msg: 'Delete permanently to save storage?', ok: 'Delete', danger: true }))) return;
  await dbAdminAction('delete_order', id, {});
  S.orders = (S.orders || []).filter(function (x) { return x.id !== id; });
  refreshOrders(true); toast('Order deleted');
};
A['admin-cancel'] = async function (el) {
  var r = await dialog({ title: 'Cancel Order?', msg: 'Enter cancellation reason:', input: true, placeholder: 'e.g. Out of stock / Customer requested', ok: 'Cancel Order', danger: true });
  if (r !== null) return runOrderUpdate(el.dataset.id, function (o) { o.status = 'cancelled'; o.cancelReason = r || 'Cancelled by store'; addLog(o, 'Cancelled by team'); });
};

function renderProdList() {
  var l = $('#prodList', S.dashM && S.dashM.sheet); if (!l) return;
  l.innerHTML = prods().length ? prods().map(function (p) {
    return '<div class="pr"><img src="' + imgSrc(p) + '" alt=""><div class="pi"><b>' + esc(p.name) + '</b><span class="muted">' + esc(p.cat) + ' · ' + inr(priceOf(p)) + '</span></div>' +
      '<button class="btn ghost sm" data-act="prod-edit" data-id="' + esc(p.id) + '">Edit</button><button class="btn dark sm" data-act="prod-del" data-id="' + esc(p.id) + '">Delete</button></div>';
  }).join('') : '<div class="empty" style="padding:30px">No products yet. Click + Add Product!</div>';
}
function prodFormHTML(p) {
  p = p || { id: '', name: '', price: '', cat: '', desc: '', img: '', inStock: true };
  return '<div class="mh"><h3 class="serif">' + (p.id ? 'Edit Product' : 'Add Product') + '</h3><button class="x" data-act="close">✕</button></div>' +
    '<form class="mb" data-form="prod"><input type="hidden" name="id" value="' + esc(p.id) + '">' +
    '<label class="fld"><span>Product Name</span><input class="inp" name="name" maxlength="80" value="' + esc(p.name) + '"></label>' +
    '<label class="fld"><span>Price (₹)</span><input class="inp" name="price" inputmode="decimal" maxlength="9" value="' + esc(p.price) + '"></label>' +
    '<label class="fld"><span>Category (Type any custom category or choose)</span><input class="inp" name="cat" list="catList" maxlength="40" placeholder="e.g. Bamboo Baskets, Clay Diyas" value="' + esc(p.cat) + '"><datalist id="catList"><option value="Clay & Terracotta"><option value="Bamboo Baskets"><option value="Serveware"></datalist></label>' +
    '<label class="fld"><span>Description</span><textarea class="inp" name="desc" rows="3" maxlength="400">' + esc(p.desc) + '</textarea></label>' +
    '<div class="fld"><span>Photo (auto-compressed)</span><div class="row"><img class="pe-img" id="peImg" src="' + imgSrc(p) + '" alt=""><div><input type="file" accept="image/*" data-change="pimg"><br><button type="button" class="lnk" data-act="pimg-clear">Remove photo</button></div></div></div>' +
    '<label class="chk"><input type="checkbox" name="inStock"' + (p.inStock !== false ? ' checked' : '') + '> In stock</label>' +
    '<p class="err" id="peErr"></p><button class="btn block" id="peBtn" type="submit">Save Product</button></form>';
}
A['prod-new'] = function () { S.editImg = ''; openModal(prodFormHTML()); };
A['prod-edit'] = function (el) { var p = getP(el.dataset.id); if (!p) return; S.editImg = p.img || ''; openModal(prodFormHTML(p)); };
C.pimg = async function (el) { var f = el.files && el.files; if (!f) return; S.editImg = await compressImage(f); $('#peImg').src = S.editImg; toast('Photo ready'); };
A['pimg-clear'] = function () { S.editImg = ''; $('#peImg').src = placeholder(''); };
F.prod = async function (form) {
  var fd = new FormData(form), err = $('#peErr'), btn = $('#peBtn'); err.textContent = '';
  var id = String(fd.get('id') || ''), name = String(fd.get('name') || '').trim(), price = Math.round(parseFloat(fd.get('price')) * 100) / 100,
    cat = String(fd.get('cat') || 'Handcrafted').trim(), desc = String(fd.get('desc') || '').trim(), stock = fd.get('inStock') === 'on';
  if (name.length < 2) { err.textContent = 'Enter product name.'; return; }
  if (!isFinite(price) || price <= 0) { err.textContent = 'Enter valid price.'; return; }
  btn.disabled = true;
  try {
    var full = await dbAdminAction('get_full_store');
    var item = { id: id || uid('p'), name: name, price: price, cat: cat, desc: desc, img: S.editImg || '', inStock: stock };
    full.products = full.products || [];
    var idx = -1; full.products.forEach(function (x, k) { if (x.id === item.id) idx = k; });
    if (idx > -1) full.products[idx] = item; else full.products.push(item);
    await dbAdminAction('update_main', '', full);
    await sync(); A.close(form); renderProdList(); toast('Product saved!');
  } catch (e) { err.textContent = e.message; btn.disabled = false; }
};
A['prod-del'] = async function (el) {
  var p = getP(el.dataset.id); if (!p) return;
  if (!(await dialog({ title: 'Delete ' + p.name + '?', msg: 'Removed for all customers immediately.', ok: 'Delete', danger: true }))) return;
  var full = await dbAdminAction('get_full_store');
  full.products = (full.products || []).filter(function (x) { return x.id !== p.id; });
  await dbAdminAction('update_main', '', full);
  await sync(); renderProdList(); toast('Deleted');
};

function teamHTML() {
  return '<div class="grid2"><div class="panel"><h4 class="sec" style="margin-top:0">Add Staff PIN</h4><form data-form="staff" autocomplete="off">' +
    '<label class="fld"><span>Staff Name</span><input class="inp" name="name" maxlength="30"></label>' +
    '<label class="fld"><span>PIN (4 to 8 digits)</span><input class="inp" name="pin" inputmode="numeric" maxlength="8" data-input="digits"></label>' +
    '<p class="err" id="stErr"></p><button class="btn" type="submit">Add Staff</button></form></div>' +
    '<div class="panel"><h4 class="sec" style="margin-top:0">Active Staff</h4><div id="staffList"></div></div></div>';
}
async function renderStaffList() {
  var l = $('#staffList', S.dashM && S.dashM.sheet); if (!l) return;
  var full = await dbAdminAction('get_full_store'), st = full.staff || [];
  l.innerHTML = st.length ? st.map(function (s) { return '<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>' + esc(s.name) + '</span><button class="btn dark sm" data-act="staff-del" data-id="' + esc(s.id) + '">Remove</button></div>'; }).join('') : '<p class="muted">No staff PINs yet.</p>';
}
F.staff = async function (form) {
  var fd = new FormData(form), err = $('#stErr'), name = String(fd.get('name') || '').trim(), pin = String(fd.get('pin') || ''); err.textContent = '';
  if (name.length < 2 || !/^\d{4,8}$/.test(pin)) { err.textContent = 'Enter valid name and 4–8 digit PIN.'; return; }
  var h = await hashPin(pin), full = await dbAdminAction('get_full_store');
  full.staff = full.staff || [];
  if (full.adminHash === h || full.staff.some(function (s) { return s.hash === h; })) { err.textContent = 'PIN already in use.'; return; }
  full.staff.push({ id: uid('st'), name: name, hash: h, at: now() });
  await dbAdminAction('update_main', '', full);
  form.reset(); renderStaffList(); toast('Staff added');
};
A['staff-del'] = async function (el) {
  if (!(await dialog({ title: 'Remove Staff PIN?', ok: 'Remove', danger: true }))) return;
  var full = await dbAdminAction('get_full_store');
  full.staff = (full.staff || []).filter(function (s) { return s.id !== el.dataset.id; });
  await dbAdminAction('update_main', '', full);
  renderStaffList(); toast('Removed');
};

function settingsHTML() {
  var s = getSettings();
  return '<div class="grid2">' +
    '<div class="panel"><h4 class="sec" style="margin-top:0">UPI, Real QR & Gateway</h4><form data-form="paysettings">' +
    '<label class="fld"><span>UPI ID</span><input class="inp" name="upiId" value="' + esc(s.upiId) + '"></label>' +
    '<label class="fld"><span>Payee Name</span><input class="inp" name="payee" value="' + esc(s.payee) + '"></label>' +
    '<div class="fld"><span>Upload Real Bank/Paytm/GPay QR Photo (Recommended)</span><input type="file" accept="image/*" data-change="qrimg">' + (S.editQrImg ? '<br><button type="button" class="lnk" data-act="qrimg-clear">Remove uploaded QR</button>' : '') + '</div>' +
    '<label class="fld"><span>Payment Gateway Key ID (Paytm/Razorpay - Optional for Auto-Confirm)</span><input class="inp" name="gatewayKey" placeholder="rzp_live_..." value="' + esc(s.gatewayKey) + '"></label>' +
    '<label class="fld"><span>Business Gmail Alert Key (Web3Forms Access Key)</span><input class="inp" name="web3Key" placeholder="Paste Web3Forms key" value="' + esc(s.web3Key) + '"></label>' +
    '<h4 class="sec">Direct Bank Transfer (Optional)</h4>' +
    '<label class="fld"><span>Account Holder Name</span><input class="inp" name="bankHolder" value="' + esc(s.bankHolder) + '"></label>' +
    '<label class="fld"><span>Bank Name</span><input class="inp" name="bankName" value="' + esc(s.bankName) + '"></label>' +
    '<label class="fld"><span>Account Number</span><input class="inp" name="bankAcc" value="' + esc(s.bankAcc) + '"></label>' +
    '<label class="fld"><span>IFSC Code</span><input class="inp" name="bankIfsc" value="' + esc(s.bankIfsc) + '"></label>' +
    '<h4 class="sec">Storefront Heading</h4>' +
    '<label class="fld"><span>Main Heading</span><input class="inp" name="heroTitle" value="' + esc(s.heroTitle) + '"></label>' +
    '<label class="fld"><span>Subtitle</span><input class="inp" name="heroSub" value="' + esc(s.heroSub) + '"></label>' +
    '<p class="err" id="psErr"></p><button class="btn" type="submit">Save All Settings</button></form></div>' +
    '<div class="panel"><h4 class="sec" style="margin-top:0">Change Admin PIN</h4><form data-form="adminpin" autocomplete="off">' +
    '<label class="fld"><span>Current PIN</span><input class="inp" type="password" name="cur" inputmode="numeric" maxlength="8" data-input="digits"></label>' +
    '<label class="fld"><span>New PIN (4–8 digits)</span><input class="inp" type="password" name="n1" inputmode="numeric" maxlength="8" data-input="digits"></label>' +
    '<label class="fld"><span>Confirm New PIN</span><input class="inp" type="password" name="n2" inputmode="numeric" maxlength="8" data-input="digits"></label>' +
    '<p class="err" id="apErr"></p><button class="btn" type="submit">Change Admin PIN</button></form></div></div>';
}
C.qrimg = async function (el) { var f = el.files && el.files; if (!f) return; S.editQrImg = await compressImage(f); toast('QR image ready — click Save All Settings'); };
A['qrimg-clear'] = function () { S.editQrImg = ''; toast('QR cleared — click Save All Settings'); };
F.paysettings = async function (form) {
  var fd = new FormData(form), err = $('#psErr'); err.textContent = '';
  try {
    var full = await dbAdminAction('get_full_store');
    full.settings = {
      upiId: String(fd.get('upiId') || '').trim(), payee: String(fd.get('payee') || '').trim(), qrImg: S.editQrImg || '',
      gatewayKey: String(fd.get('gatewayKey') || '').trim(), web3Key: String(fd.get('web3Key') || '').trim(),
      bankHolder: String(fd.get('bankHolder') || '').trim(), bankName: String(fd.get('bankName') || '').trim(),
      bankAcc: String(fd.get('bankAcc') || '').trim(), bankIfsc: String(fd.get('bankIfsc') || '').trim(),
      heroEye: 'Handcrafted with care',
      heroTitle: String(fd.get('heroTitle') || '').trim() || DEFAULT_SETTINGS.heroTitle,
      heroSub: String(fd.get('heroSub') || '').trim() || DEFAULT_SETTINGS.heroSub
    };
    await dbAdminAction('update_main', '', full);
    await sync(); toast('All settings saved!');
  } catch (e) { err.textContent = e.message; }
};
F.adminpin = async function (form) {
  var fd = new FormData(form), err = $('#apErr'), cur = String(fd.get('cur')), n1 = String(fd.get('n1')), n2 = String(fd.get('n2')); err.textContent = '';
  if (!/^\d{4,8}$/.test(n1) || n1 !== n2) { err.textContent = 'Check new PIN (4–8 digits, must match).'; return; }
  if (await hashPin(cur) !== S.auth.hash) { err.textContent = 'Current PIN is incorrect.'; return; }
  var nh = await hashPin(n1), full = await dbAdminAction('get_full_store');
  full.adminHash = nh;
  await dbAdminAction('update_main', '', full);
  S.auth.hash = nh; form.reset(); toast('Admin PIN changed!');
};

function applyStore(pub) {
  var sig = JSON.stringify(pub);
  if (S.store && sig === S.storeSig) return;
  S.storeSig = sig; S.store = pub; S.loadErr = '';
  pruneCart(); renderGrid(); updateBadge(); renderBag();
}
async function sync() {
  if (!sb || S.syncing) return;
  S.syncing = true;
  try {
    var pub = await ensureStoreSeeded();
    S.fails = 0; setBanner('');
    applyStore(pub);
    if (S.auth) {
      var ords = await dbAdminAction('get_all_orders');
      if (JSON.stringify(ords) !== S.ordSig) { S.ordSig = JSON.stringify(ords); S.orders = ords; refreshOrders(); }
    }
    if (S.myIds.length && S.ordM && !S.ordM.closed) await syncMy();
  } catch (e) {
    S.fails++;
    if (!S.store) { S.loadErr = 'Could not load store. Check connection.'; renderGrid(); }
    else if (S.fails >= 2) setBanner('Connection issue. Retrying…');
  } finally { S.syncing = false; }
}

updateBadge(); renderGrid();
$('#search').addEventListener('input', function (e) { S.q = e.target.value; renderGrid(); });
sync();
setInterval(function () { if (!document.hidden) sync(); }, POLL_MS);
document.addEventListener('visibilitychange', function () { if (!document.hidden) sync(); });
})();
</script>
</body>
